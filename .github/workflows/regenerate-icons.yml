# Temporary: renders app.xaml, app.png and app.ico from the new app.svg on Windows,
# because the generator needs WPF. Removed once the outputs are committed.
name: Regenerate icons (temporary)
on:
  push:
    branches: ['claude/apple-polish-installer']
    paths: ['desktop/AirFlash.App/Assets/app.svg', '.github/workflows/regenerate-icons.yml']
permissions:
  contents: read
jobs:
  icons:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Generate icons from app.svg
        shell: pwsh
        run: pwsh -NoProfile -STA -File scripts/generate-icons.ps1
      - name: Verify
        shell: pwsh
        run: pwsh -NoProfile -STA -File scripts/generate-icons.ps1 -Check
      - uses: actions/upload-artifact@v4
        with:
          name: generated-icons
          path: |
            desktop/AirFlash.App/Assets/app.xaml
            desktop/AirFlash.App/Assets/app.png
            desktop/AirFlash.App/Assets/app.ico
          if-no-files-found: error
          retention-days: 3
